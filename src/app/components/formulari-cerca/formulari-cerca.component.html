<div class="formulari-cerca">
    <form [formGroup]="formulariCerca" (ngSubmit)="cercar()">
        <div class="camp-cerca">
            <input type="text" formControlName="termeCerca" placeholder="Cerca elements per nom..." class="input-cerca"
                [class.invalid]="termeInvalid">
            
            <div class="indicadors">
                <!-- Indicador visual durant la validació asíncrona -->
                <span class="spinner-petit" *ngIf="estaCarregant || estaValidant"></span>
                <span class="text-validant" *ngIf="estaValidant">Validant...</span>
                
                <!-- Botó Netejar: apareix únicament quan el camp conté text -->
                <button type="button" class="btn-netejar" (click)="netejar()"
                    *ngIf="formulariCerca.get('termeCerca')?.value && !estaValidant">✕</button>
            </div>
        </div>

        <!-- Missatges d'error visibles per a cada validació (només si ng-touched) -->
        <div class="missatge-error" *ngIf="termeInvalid">
            {{ missatgeError }}
        </div>

        <div class="accions">
            <button type="submit" class="btn-cercar"
                [disabled]="formulariCerca.invalid || estaCarregant || estaValidant">
                Cercar
            </button>
        </div>
    </form>
</div>
